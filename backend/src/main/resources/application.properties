# ============================================================
#  ChatSphere — Spring Boot configuration
#  Secrets are injected via environment variables (see .env.example)
# ============================================================
spring.application.name=chat-backend

# --- Database (PostgreSQL 16) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chatdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chatpass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Run data.sql AFTER Hibernate has created/updated the schema (GIN index for full-text search)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- JWT ---
# REQUIRED: 32+ character secret, no default on purpose — the app refuses to start without it.
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# --- CORS (comma-separated list of allowed frontend origins) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# --- File uploads ---
app.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# --- Server ---
server.port=${PORT:8080}
server.shutdown=graceful
# Trust X-Forwarded-* headers from Railway/Nginx reverse proxies
server.forward-headers-strategy=framework

# --- Actuator (health endpoint used by Docker healthchecks) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- Logging ---
logging.level.org.springframework.security=WARN
logging.level.com.example.chat=INFO
