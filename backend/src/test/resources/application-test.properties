# Test profile: in-memory H2 in PostgreSQL mode; overrides src/main/resources/application.properties
spring.datasource.url=jdbc:h2:mem:chatdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# data.sql contains PostgreSQL-only DDL (GIN index) — never run it on H2
spring.sql.init.mode=never

# Test-only fixtures (not production secrets)
jwt.secret=test-only-secret-0123456789-0123456789-abcdef
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

app.cors.allowed-origins=http://localhost:5173
app.upload-dir=./target/test-uploads

logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
