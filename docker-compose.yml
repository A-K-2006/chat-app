# ============================================================
#  ChatSphere — one-command local deployment
#
#    docker-compose up --build   ->   http://localhost
#
#  Dev-only default credentials below; for anything public,
#  copy .env.example to .env and set real values.
# ============================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatdb}
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat} -d ${POSTGRES_DB:-chatdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Not exposed to the host by default; uncomment for local psql access:
    # ports:
    #   - "5432:5432"

  backend:
    build: ./backend
    container_name: chat-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chatdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-chat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-chatpass}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    ports:
      - "8080:8080" # optional: direct API access for debugging

  frontend:
    build: ./frontend
    container_name: chat-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
