server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> Spring Boot (internal ingress, HTTPS)
    location /api/ {
        proxy_pass https://chat-backend.bravesea-1d87fdbf.centralindia.azurecontainerapps.io;
        proxy_ssl_server_name on;
        proxy_set_header Host chat-backend.bravesea-1d87fdbf.centralindia.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (SockJS) -> Spring Boot
    location /ws/ {
        proxy_pass https://chat-backend.bravesea-1d87fdbf.centralindia.azurecontainerapps.io;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host chat-backend.bravesea-1d87fdbf.centralindia.azurecontainerapps.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
